[package]
name = "thalos_visual"
version = "0.1.0"
edition = "2024"

[dependencies]
thalos-engine = { path = "../thalos-engine" }
thalos-importer = { path = "../thalos-importer" }
serde = { version = "1", features = ["derive"] }
stl = "0.2"
quick-xml = "0.37"
thiserror = "2"

[dev-dependencies]
insta = { version = "1.47", features = ["json"] }
serde_json = "1"
rand = "0.8"
tempfile = "3"
