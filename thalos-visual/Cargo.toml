[package]
name = "thalos_visual"
version.workspace = true
edition.workspace = true

[dependencies]
thalos-core = { path = "../thalos-core" }
thalos-math = { path = "../thalos-math" }
thalos-models = { path = "../thalos-models" }
thalos-importer = { path = "../thalos-importer" }
serde = { version = "1", features = ["derive"] }
stl = "0.2"
quick-xml = "0.37"
thiserror = "2"

[dev-dependencies]
insta = { version = "1.47", features = ["json"] }
serde_json = "1"
rand = "0.8"
tempfile = "3"
