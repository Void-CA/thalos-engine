[package]
name = "thalos_runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
thalos-engine = { path = "../thalos-engine" }
thalos-language-service = { path = "../thalos-language-service" }
thalos-importer = { path = "../thalos-importer" }
thalos-document = { path = "../thalos-document" }
thalos_ports = { path = "../thalos-ports", features = ["test-support"] }
thalos-core = { path = "../thalos-core" }
thalos-models = { path = "../thalos-models" }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "net", "io-util", "fs", "time"] }
async-trait = "0.1"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
thalos_transport = { path = "../thalos-transport" }
tracing = "0.1"
[features]
test-support = []

[dev-dependencies]
thalos-engine = { path = "../thalos-engine", features = ["test-support"] }
thalos-persistence = { path = "../../thalos-industrial/backend/crates/thalos-persistence" }
thalos-lang = { path = "../thalos-lang" }
thalos-semantic = { path = "../thalos-semantic" }

tempfile = "3"

