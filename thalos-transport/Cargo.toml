[package]
name = "thalos_transport"
version.workspace = true
edition.workspace = true

[features]
physical-e2e = []

[dependencies]
thalos-core = { path = "../thalos-core" }
thalos-ports = { path = "../thalos-ports", features = ["test-support"] }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "net", "io-util", "time"] }
tokio-serial = "5"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


