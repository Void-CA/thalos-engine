[package]
name = "thalos-semantic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
test-support = ["dep:thalos-planning"]

[dependencies]
thalos-core = { path = "../thalos-core" }
thalos-math = { path = "../thalos-math" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
thalos-planning = { path = "../thalos-planning", optional = true }

[dev-dependencies]
thalos-planning = { path = "../thalos-planning" }

[[test]]
name = "ir_properties"
required-features = ["test-support"]

[[test]]
name = "e2e_canonical_pipeline"
required-features = ["test-support"]

[[test]]
name = "golden_corpus"
required-features = ["test-support"]
