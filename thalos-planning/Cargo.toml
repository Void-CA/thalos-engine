[package]
name = "thalos-planning"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
thalos-core = { path = "../thalos-core" }
thalos-math = { path = "../thalos-math" }
thalos-collision = { path = "../thalos-collision" }
thalos-optimization = { path = "../thalos-optimization" }
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
serde_json = "1"
thalos-semantic = { path = "../thalos-semantic" }
thalos-intelligence = { path = "../thalos-intelligence" }

[[bench]]
name = "analyze"
harness = false
