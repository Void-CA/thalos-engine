[package]
name = "thalos_core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
thalos_math = { path = "../thalos-math" }
thalos_models = { path = "../thalos-models" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
serde_json = "1"

[[bench]]
name = "workspace_sampling"
harness = false

[[bench]]
name = "reachability"
harness = false
