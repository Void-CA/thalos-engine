[package]
name = "thalos-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
thalos-core = { path = "../thalos-core" }
thalos-analysis = { path = "../thalos-analysis" }
thalos-math = { path = "../thalos-math" }
thalos-models = { path = "../thalos-models" }
thalos-planning = { path = "../thalos-planning" }
thalos-lang = { path = "../thalos-lang" }
thalos-language-service = { path = "../thalos-language-service" }
thalos-importer = { path = "../thalos-importer" }
thalos_ports = { path = "../thalos-ports" }
thalos-document = { path = "../thalos-document" }
thalos_visual = { path = "../thalos-visual" }

[features]
# Test doubles (fake transports, canonical semantic fixtures) across the public
# boundary. Off by default so production consumers do not pull test code.
test-support = ["thalos_ports/test-support", "thalos-language-service/test-support"]
